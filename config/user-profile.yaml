# PRISM User Profile — DuskWun
# Fill this in once. PRISM reads it for every piece of content.
# Update anytime your goals or voice changes.

name: DuskWun

# 3-5 topics you post about most
topics:
  - AI agents and automation for businesses
  - Building in public / "Shut Up and Build" brand
  - Crypto and Web3 (BTC, ETH, Solana)
  - Business growth for tradies and SMBs (Perth/Australia focus)
  - EMVY (AI audit agency)

# How you sound when you post
voice:
  style: |
    Direct, no fluff, gets to the point fast.
    Short sentences. Action-oriented. Tells it like it is.
    Doesn't sound corporate or guru-like.

  tone: |
    Confident, sometimes contrarian.
    Builder mindset — "stop talking, start shipping."
    Occasionally self-deprecating about the journey.
    Doesn't over-hype or use exclamation marks.

  sounds_like: |
    A tradie who figured out tech.
    A mate who's building something real.
    Someone who's done the work and has the receipts.

  avoids: |
    - Corporate buzzwords ("leveraging", "synergy", "disruptive")
    - Vague claims ("great results", "amazing progress")
    - Engagement bait ("tag a friend who...", "like if you agree")
    - Thread-for-the-sake-of-threading
    - Posting links in the main tweet body
    - Hashtag overload (max 2 per post)

# What you're trying to achieve
goals:
  primary: |
    Grow following and establish authority in AI + building in public space.
    "Shut Up and Build" brand recognition.

  secondary: |
    Build credibility for EMVY (AI audit agency).
    Drive people to follow for updates on what we're building.

  target_audience: |
    Tradies and SMB owners in Perth/Australia (primary for EMVY).
    Indie hackers, builders, AI-curious founders (secondary for personal brand).
    People who want to see real work, not hype.

  call_to_action_style: |
    Ask a question at the end to drive replies.
    Or: "Save this if you know a [tradie/SMB owner] who needs to hear this."
    Never: "Follow for more!"

# Which platforms and when
platforms:
